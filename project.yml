# XcodeGen project spec for WaifuClaw for iOS.
# Reproducible project generation on a Mac with Xcode:
#
#   brew install xcodegen
#   cd ios && xcodegen generate
#
# This keeps the .xcodeproj out of the repo (it's generated) while the spec
# stays reviewable. See BUILD_NOTES.md for the full Mac-side checklist
# (signing, StoreKit config, TestFlight).

name: WaifuClaw

options:
  bundleIdPrefix: studio.phantomhorizons.waifuclaw
  deploymentTarget:
    iOS: "17.0"

packages:
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX.git
    exactVersion: "0.4.0"
  libgit2:
    url: https://github.com/ibrahimcetin/libgit2.git
    exactVersion: "1.9.2"
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: "0.12.1"
  swift-log:
    url: https://github.com/apple/swift-log.git
    exactVersion: "1.6.2"

targets:
  WaifuClaw:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # The old paired-desktop leaves remain in the repository as migration
      # references, but are not reachable or compiled into the native app.
      # In particular, production must not contain Mock* dashboard/run/team data.
      - path: WaifuClaw/App/WaifuClawApp.swift
      - path: WaifuClaw/Theme/Theme.swift
      - path: WaifuClaw/Core/Security/KeychainStore.swift
      - path: WaifuClaw/Assets.xcassets
      - path: WaifuClaw/LaunchScreen.storyboard
        buildPhase: resources
      - path: WaifuClaw/Fonts
        buildPhase: resources
      - path: WaifuClaw/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: WaifuClaw/Features/DesignSystem/Components/ProgressBar.swift
      - path: WaifuClaw/Features/DesignSystem/Kline/KlineAvatar.swift
      - path: WaifuClaw/Features/DesignSystem/Kline/kline-operator.png
      - path: WaifuClaw/Features/Onboarding/OnboardingKeys.swift
      - path: WaifuClaw/Features/Onboarding/OnboardingStep.swift
      - path: WaifuClaw/Features/Onboarding/OnboardingView.swift
      - path: WaifuClaw/Features/Onboarding/IntroPagesView.swift
      - path: WaifuClaw/Features/Onboarding/DisplayNameView.swift
      - path: WaifuClaw/Local
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
    info:
      path: WaifuClaw/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: studio.phantomhorizons.waifuclaw.ios
      PRODUCT_NAME: WaifuClaw
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      SWIFT_VERSION: "5.9"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
      TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1
      ENABLE_BITCODE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      # Attach WaifuClaw.storekit here once created in Xcode
      # (File → New → StoreKit Configuration File) for simulator IAP testing.
      testTargets:
        - WaifuClawTests
        - WaifuClawUITests
    dependencies:
      - package: SwiftGitX
        product: SwiftGitX
      - package: libgit2
        product: libgit2
      - package: MCP
        product: MCP
      - package: swift-log
        product: Logging

  WaifuClawTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaifuClawTests
    dependencies:
      - target: WaifuClaw
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: studio.phantomhorizons.waifuclaw.ios.tests
      GENERATE_INFOPLIST_FILE: YES
      SWIFT_VERSION: "5.9"

  WaifuClawUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaifuClawUITests
    dependencies:
      - target: WaifuClaw
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: studio.phantomhorizons.waifuclaw.ios.uitests
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: WaifuClaw
      SWIFT_VERSION: "5.9"
