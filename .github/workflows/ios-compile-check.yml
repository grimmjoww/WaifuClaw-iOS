# iOS compile check — runs on GitHub's own Mac machines.
# No extra accounts, no extra apps to install: it just runs on this repo.
# Unsigned build checks SwiftUI compilation and simulator behavior; signing and
# TestFlight still need configured distribution credentials and an app record.
name: iOS compile check

on:
  push:
    branches: ['main', 'feat/*', 'fix/*']
    paths: ['WaifuClaw/**', 'WaifuClawTests/**', 'WaifuClawUITests/**', 'project.yml', '.github/workflows/ios-compile-check.yml', 'codemagic.yaml']
  pull_request:
    paths: ['WaifuClaw/**', 'WaifuClawTests/**', 'WaifuClawUITests/**', 'project.yml', '.github/workflows/ios-compile-check.yml', 'codemagic.yaml']
  workflow_dispatch:

jobs:
  compile:
    name: Compile and test SwiftUI (unsigned)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build WaifuClaw (unsigned compile check)
        id: build
        run: |
          xcodebuild build \
            -project WaifuClaw.xcodeproj \
            -scheme WaifuClaw \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Test WaifuClaw on iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"].values(); print(next((d["udid"] for devices in groups for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")), ""))')
          test -n "$SIMULATOR_ID" || { echo 'No available iPhone simulator'; exit 1; }
          xcodebuild test \
            -project WaifuClaw.xcodeproj \
            -scheme WaifuClaw \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Record real companion motion on iPhone simulator
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"].values(); print(next((d["udid"] for devices in groups for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")), ""))')
          test -n "$SIMULATOR_ID"
          xcrun simctl boot "$SIMULATOR_ID" || true
          python3 - "$SIMULATOR_ID" <<'PY'
          import subprocess, sys
          subprocess.run(['xcrun', 'simctl', 'bootstatus', sys.argv[1], '-b'], check=True, timeout=90)
          PY
          APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/Debug-iphonesimulator/WaifuClaw.app' -print -quit)
          test -n "$APP_PATH" || { echo 'Simulator app not built'; exit 1; }
          xcrun simctl install "$SIMULATOR_ID" "$APP_PATH"
          xcrun simctl terminate "$SIMULATOR_ID" studio.phantomhorizons.waifuclaw.ios || true
          xcrun simctl launch "$SIMULATOR_ID" studio.phantomhorizons.waifuclaw.ios -hasCompletedOnboarding YES
          mkdir -p visual-qa
          python3 - "$SIMULATOR_ID" <<'PY'
          import os, signal, subprocess, sys, time
          time.sleep(2)
          recorder = subprocess.Popen(
              ['xcrun', 'simctl', 'io', sys.argv[1], 'recordVideo', '--codec=h264', '--force', 'visual-qa/companion-home.mp4'],
              start_new_session=True,
          )
          try:
              time.sleep(5)
              if recorder.poll() is None:
                  os.killpg(recorder.pid, signal.SIGINT)
              recorder.wait(timeout=20)
          except subprocess.TimeoutExpired:
              try:
                  os.killpg(recorder.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              recorder.wait(timeout=5)
              raise RuntimeError('Simulator recording did not finish; no motion proof was captured')
          PY
          test -s visual-qa/companion-home.mp4

      - name: Upload simulator companion motion proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-motion-simulator
          path: visual-qa/companion-home.mp4
          if-no-files-found: warn
          retention-days: 7
